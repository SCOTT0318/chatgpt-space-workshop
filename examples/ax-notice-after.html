<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신청서 보완 서류 제출 안내</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #142825; background: #f4f7f2; }
    body { margin: 0; }
    main { box-sizing: border-box; width: min(calc(100% - 2rem), 40rem); margin: clamp(2rem, 9vw, 6rem) auto; padding: clamp(1.4rem, 5vw, 3rem); background: #fff; border-top: .35rem solid #126450; border-radius: 0 0 1rem 1rem; }
    .label { color: #46605a; font-size: .875rem; font-weight: 700; }
    h1 { margin: .5rem 0 1rem; font-size: clamp(1.7rem, 5.5vw, 2.5rem); line-height: 1.22; word-break: keep-all; }
    p, li { line-height: 1.65; }
    ul { padding-inline-start: 1.3rem; }
    li + li { margin-top: .4rem; }
  </style>
</head>
<body>
  <main>
    <p class="label">AX 강연용 가상 예시</p>
    <h1>신청서 보완 서류 제출 안내</h1>
    <ul>
      <li><strong>대상:</strong> 보완 요청을 받은 분</li>
      <li><strong>제출 기한:</strong> 다음 주 월요일 오전 11시</li>
      <li><strong>제출 방법:</strong> 기존 안내 메일에 회신</li>
    </ul>
    <p>문의는 안내 메일에 회신해 주세요.</p>
  </main>
</body>
</html>
