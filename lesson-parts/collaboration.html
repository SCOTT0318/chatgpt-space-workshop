 <figure class="lg-lesson" aria-labelledby="lg-sharing-title">
  <figcaption class="lg-heading"><div><span class="lg-kicker">VISUAL LESSON / 공유 권한</span><h3 id="lg-sharing-title">링크를 넣는 것과 내용을 옮기는 것은 다릅니다.</h3><p>같은 원본을 Page에 연결해도, 독자가 볼 수 있는 내용은 달라집니다.</p></div><span class="lg-example">교육용 모식도</span></figcaption>
  <div class="lg-source"><svg class="lg-icon" aria-hidden="true"><use href="#i-file"/></svg><div><strong>원본 · Drive의 사내 정책 문서</strong><span>원본 시스템에서 허용된 사람만 원본을 열 수 있습니다.</span></div><b>원본 권한 유지</b></div>
  <div class="lg-sharing-map">
   <div class="lg-route-label"><span class="lg-letter">A</span><div><strong>링크만 연결</strong><span>원본이 있는 곳을 가리킵니다.</span></div></div>
   <div class="lg-page-boundary lg-route-a"><span class="lg-boundary-name"><svg class="lg-icon" aria-hidden="true"><use href="#i-users"/></svg>공유 Page 안</span><div class="lg-reference"><svg class="lg-icon" aria-hidden="true"><use href="#i-link"/></svg><span>사내 정책 원본 보기 ↗</span></div><small>문서 본문을 이 Page로 복사하지 않은 경우</small></div>
   <div class="lg-viewer"><svg class="lg-icon" aria-hidden="true"><use href="#i-shield"/></svg><strong>원본을 열려면<br>원본의 접근 권한도 필요</strong><span>Page 접근 권한만으로 원본 권한이 생기지 않습니다.</span></div>
   <div class="lg-route-label"><span class="lg-letter">B</span><div><strong>본문을 복사·요약</strong><span>내용이 Page의 일부가 됩니다.</span></div></div>
   <div class="lg-page-boundary lg-route-b"><span class="lg-boundary-name"><svg class="lg-icon" aria-hidden="true"><use href="#i-users"/></svg>공유 Page 안</span><div class="lg-summary"><span>정책 요약</span><strong>“배송 가능일은 재고·배송지와<br>물류 확인 후 안내합니다.”</strong></div><small>Page에 실제로 적힌 내용</small></div>
   <div class="lg-viewer lg-visible"><svg class="lg-icon" aria-hidden="true"><use href="#i-users"/></svg><strong>Page 독자는<br>이 요약을 볼 수 있음</strong><span>원본이 비공개여도 복사한 내용을 숨겨주지는 않습니다.</span></div>
  </div>
  <div class="lg-sharing-foot"><div class="lg-private"><svg class="lg-icon" aria-hidden="true"><use href="#i-comment"/></svg><p><b>개인 채팅·저장된 메모리</b><br>Page 공유만으로 자동 공유되지 않습니다. 그 내용을 Page에 붙여넣으면 Page 독자가 볼 수 있습니다.</p></div><div class="lg-site"><span class="lg-site-separator">별도 경계</span><svg class="lg-icon" aria-hidden="true"><use href="#i-shield"/></svg><p><b>웹사이트로 게시할 때</b><br>Site의 방문자 권한과 공개 범위를 다시 확인합니다. Space의 권한과 같다고 가정하지 않습니다.</p></div></div>
  <details class="lg-check-question"><summary>확인 질문: 원본을 못 여는 동료가 Page의 정책 요약은 읽을 수 있을까요?</summary><p><b>그 Page에 접근할 수 있다면 읽을 수 있습니다.</b> 원본 링크의 권한과 Page에 옮겨 적힌 내용의 권한을 따로 확인해야 합니다.</p></details>
  <p class="lg-source-link">기능 근거: <a href="https://learn.chatgpt.com/docs/space/collaboration" target="_blank" rel="noopener noreferrer">Space 협업</a> · <a href="https://learn.chatgpt.com/docs/sites/publishing-and-sharing" target="_blank" rel="noopener noreferrer">Sites 게시·공유</a></p>
 </figure>

 <figure class="lg-lesson" aria-labelledby="lg-schedule-title">
  <figcaption class="lg-heading"><div><span class="lg-kicker">VISUAL LESSON / 반복 실행</span><h3 id="lg-schedule-title">“매주 해줘”라는 문장, 실제 예약은 어디에 남나요?</h3><p>문서에 남기는 요청·기준과, 저장된 실행 조건을 나누어 봅니다.</p></div><span class="lg-example">교육용 모식도</span></figcaption>
  <div class="lg-schedule-map">
   <div class="lg-written"><span class="lg-stage">01 · 문서에 적어둔 상태</span><div class="lg-paper"><div class="lg-paper-top"><svg class="lg-icon" aria-hidden="true"><use href="#i-file"/></svg><b>주간 영업 실행계획</b></div><div class="lg-block"><span>Prompt</span><p>이 Page의 미해결 과제를 요약해줘.</p></div><div class="lg-block"><span>Agent Instructions</span><p>숫자는 원본과 대조하고,<br>미확인 원인은 단정하지 않는다.</p></div><div class="lg-text-schedule">매주 월요일 오전 9시에 확인</div></div><div class="lg-unregistered"><svg class="lg-icon" aria-hidden="true"><use href="#i-clock"/></svg><div><b>이 문장만으로 예약 완료가 되지는 않습니다.</b><span>Prompt는 실행할 요청, 지침은 작업할 때 따를 기준입니다.</span></div></div></div>
   <div class="lg-registration-arrow" aria-hidden="true"><span>예약 생성<br>요청</span><b>→</b></div>
   <div class="lg-registered"><span class="lg-stage">02 · 별도 예약을 등록한 뒤</span><div class="lg-scheduled"><div class="lg-scheduled-top"><svg class="lg-icon" aria-hidden="true"><use href="#i-clock"/></svg><strong>Scheduled</strong><span>확인할 화면의 예</span></div><h4>기한 지난 미완료 과제 확인</h4><dl><div><dt>저장된 작업</dt><dd>요청한 작업이 목록에 있는가?</dd></div><div><dt>실행 상태</dt><dd>활성 상태인가?</dd></div><div><dt>시간·시간대</dt><dd>매주 월 09:00 · Asia/Seoul인가?</dd></div><div><dt>다음 실행</dt><dd>다음 실행 시각이 맞는가?</dd></div></dl><div class="lg-first-run"><svg class="lg-icon" aria-hidden="true"><use href="#i-check"/></svg><span><b>마지막 확인</b><br>첫 실행 결과와 알림 조건을 검토합니다.</span></div></div><p class="lg-registration-note">예약 생성 응답만 읽고 끝내지 않고, 저장된 상태와 실제 결과까지 확인합니다.</p></div>
  </div>
  <div class="lg-three-meanings"><p><span>Prompt</span><b>무엇을 요청할까?</b><small>독자가 실행할 요청</small></p><p><span>지침</span><b>어떤 기준을 지킬까?</b><small>작업 중 따를 원칙</small></p><p><span>예약</span><b>언제 다시 실행할까?</b><small>저장한 실행 조건</small></p></div>
  <p class="lg-schedule-limit">예약과 자동 갱신의 제공 여부는 계정·환경에서 확인합니다. 메뉴가 보이지 않으면 설정안을 작성하고 <b>“미등록”</b>으로 표시합니다.</p>
  <p class="lg-source-link">기능 근거: <a href="https://learn.chatgpt.com/docs/space/pages" target="_blank" rel="noopener noreferrer">Page의 Prompt·지침 블록</a> · <a href="https://learn.chatgpt.com/docs/automations" target="_blank" rel="noopener noreferrer">예약 작업</a></p>
 </figure>
